[project]
name = "paperscale"
version = "0.1.0"
description = "OCR at scale using VLMs"
authors = [
    {name = "charitarthchugh",email = "37895518+charitarthchugh@users.noreply.github.com"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "openai (>=2.37.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pillow (>=10.0.0,<12.0.0)",
    "rich (>=15.0.0,<16.0.0)"
]

[project.optional-dependencies]
mock-api = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.48.0,<0.49.0)"
]

[tool.poetry]
packages = [{ include = "paperscale", from = "src" }]

[dependency-groups]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
    "pyrefly (>=1.0.0,<2.0.0)",
    "ruff (>=0.15.13,<0.16.0)",
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn[standard] (>=0.48.0,<0.49.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "coverage (>=7.14.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
paperscale = "paperscale.cli:main"
paperscale-mock-api = "paperscale.mock_api.cli:main"

[tool.pyrefly]
search-path = ["src", "."]
