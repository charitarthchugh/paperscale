[project]
name = "paperscale"
version = "0.5.0"
description = "Local, model-agnostic OCR-to-Markdown at scale (an olmOCR-style pipeline)"
authors = [
    {name = "charitarthchugh",email = "37895518+charitarthchugh@users.noreply.github.com"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "pypdf (>=6.13.3,<7.0.0)",
    "pypdfium2 (>=4.30.0,<5.0.0)",
    "tqdm (>=4.66.0,<5.0.0)",
    "ftfy (>=6.0.0,<7.0.0)",
    "zstandard (>=0.22.0,<0.24.0)",
    "pyyaml (>=6.0.0,<7.0.0)",
    "lingua-language-detector (>=2.0.0,<3.0.0)",
    "img2pdf (>=0.5.0,<0.7.0)",
    "markdownify (>=1.2.0,<2.0.0)"
]

[tool.poetry]
packages = [{ include = "paperscale", from = "src" }]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pyrefly (>=1.0.0,<2.0.0)",
    "ruff (>=0.15.13,<0.16.0)",
    "coverage (>=7.14.0,<8.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
paperscale = "paperscale.pipeline:cli_main"

[tool.pyrefly]
search-path = ["src", "."]

[tool.ruff]
line-length = 160
